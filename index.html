<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة السلام للمقاولات والتوريدات العمومية - نظام تتبع الأسطول</title>
    <style>
        body { 
            font-family: Tahoma, sans-serif; 
            background-color: #f4f6f9; 
            text-align: center; 
            padding: 40px 20px; 
            margin: 0; 
        }
        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1); 
            max-width: 450px; 
            margin: auto; 
        }
        .logo-container {
            margin-bottom: 20px;
        }
        img.logo { 
            width: 120px; 
            height: 120px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 3px solid #ff6600; 
            box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
        }
        h2 { 
            color: #1a252f; 
            margin-bottom: 5px; 
            font-size: 20px;
        }
        p.subtitle { 
            color: #666; 
            font-size: 14px; 
            margin-bottom: 25px; 
        }
        .btn { 
            display: block; 
            background-color: #ff6600; 
            color: white; 
            text-decoration: none; 
            padding: 14px; 
            font-size: 16px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            font-weight: bold; 
            transition: 0.3s; 
        }
        .btn:hover { 
            background-color: #e55c00; 
        }
        .btn.admin { 
            background-color: #1a252f; 
        }
        .btn.admin:hover { 
            background-color: #2c3e50; 
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- قسم اللوجو -->

        <a href="driver.html" class="btn">🚗 بوابة السائقين (إرسال الموقع)</a>

    </div>

</body>
