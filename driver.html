<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة السلام - بوابة السائقين</title>
    <style>
        body { font-family: Tahoma, sans-serif; text-align: center; background-color: #f4f6f9; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0px 4px 15px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        input { padding: 12px; width: 85%; font-size: 16px; text-align: center; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 15px; }
        button { background-color: #28a745; color: white; border: none; padding: 14px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
        button.stop { background-color: #dc3545; }
        .status { margin-top: 15px; font-weight: bold; color: #333; }
        .coords { font-size: 14px; color: #666; margin-top: 10px; }
        .mode-info { font-size: 12px; color: #e0a800; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>نظام تتبع الأسطول</h2>
        <p>أدخل كود الرحلة للبدء في إرسال الموقع:</p>
        
        <input type="text" id="tripId" placeholder="مثال: TRIP-1001"><br>
        
        <button id="toggleBtn" onclick="toggleTracking()">بدء التتبع وإرسال الموقع</button>
        
        <div class="status" id="statusText">التتبع متوقف</div>
        <div class="coords" id="coordsText">الإحداثيات: --</div>
        <div class="mode-info" id="modeInfo"></div>
    </div>

    <script>
        let trackingInterval = null;
        let isTracking = false;
        
        // ضع هنا رابط الـ Web App الصحيح الذي ينتهي بـ /exec
        const WEB_APP_URL = "PUT_YOUR_WEB_APP_URL_HERE"; 

        let currentLat = 30.044420;
        let currentLng = 31.235710;

        function toggleTracking() {
            const tripId = document.getElementById('tripId').value.trim();
            const btn = document.getElementById('toggleBtn');
            const statusText = document.getElementById('statusText');
            const modeInfo = document.getElementById('modeInfo');

            if (!tripId) {
                alert("من فضلك أدخل كود الرحلة أولاً!");
                return;
            }

            if (!isTracking) {
                isTracking = true;
                btn.innerText = "إيقاف التتبع";
                btn.className = "stop";
                statusText.innerText = "جاري إرسال الموقع بنجاح...";

                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        function(position) {
                            modeInfo.innerText = "متصل عبر GPS حقيقي 🛰️";
                            startRealTracking(tripId);
                        },
                        function(error) {
                            modeInfo.innerText = "يعمل في وضع المحاكاة للتجربة 💻";
                            startSimulationTracking(tripId);
                        },
                        { timeout: 5000, enableHighAccuracy: false }
                    );
                } else {
                    modeInfo.innerText = "يعمل في وضع المحاكاة للتجربة 💻";
                    startSimulationTracking(tripId);
                }
            } else {
                stopTracking();
            }
        }

        function startRealTracking(tripId) {
            trackingInterval = setInterval(() => {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    document.getElementById('coordsText').innerText = `خط العرض: ${lat.toFixed(5)} | خط الطول: ${lng.toFixed(5)}`;
                    sendDataToSheet(tripId, lat, lng);
                });
            }, 5000);
        }

        function startSimulationTracking(tripId) {
            trackingInterval = setInterval(() => {
                currentLat += (Math.random() - 0.5) * 0.001;
                currentLng += (Math.random() - 0.5) * 0.001;
                document.getElementById('coordsText').innerText = `خط العرض: ${currentLat.toFixed(5)} | خط الطول: ${currentLng.toFixed(5)}`;
                sendDataToSheet(tripId, currentLat, currentLng);
            }, 5000);
        }

        function stopTracking() {
            if (trackingInterval !== null) {
                clearInterval(trackingInterval);
                trackingInterval = null;
            }
            isTracking = false;
            document.getElementById('toggleBtn').innerText = "بدء التتبع وإرسال الموقع";
            document.getElementById('toggleBtn').className = "";
            document.getElementById('statusText').innerText = "التتبع متوقف";
            document.getElementById('modeInfo').innerText = "";
        }

        function sendDataToSheet(tripId, lat, lng) {
            const url = `${WEB_APP_URL}?tripId=${encodeURIComponent(tripId)}&lat=${lat}&lng=${lng}`;
            fetch(url, { method: 'GET', mode: 'no-cors' })
                .then(() => console.log("تم تحديث الموقع"))
                .catch(err => console.error("خطأ:", err));
        }
    </script>

</body>
</html>
